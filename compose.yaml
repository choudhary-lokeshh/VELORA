name: velora-local

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: velora
      POSTGRES_PASSWORD: velora_local_only
      POSTGRES_USER: velora
    ports:
      - '127.0.0.1:${VELORA_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velora -d velora']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.0-alpine3.23
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - '60'
      - '1'
    ports:
      - '127.0.0.1:${VELORA_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
