name: verify

# The repository's only pipeline. It provisions the pinned toolchain and runs
# the canonical `pnpm ci:verify` graph; it never duplicates that graph here.
# The scheduled run exists so the dependency risk acceptance expiry in
# docs/security/08-dependency-risk-acceptance.md fires on time even when no
# commit lands.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Docker is preinstalled, which Testcontainers requires for the real
    # PostgreSQL and Redis integration tests.
    runs-on: ubuntu-24.04
    # The canonical gate itself runs in roughly fifteen minutes. The rest of
    # this budget is provisioning headroom, and provisioning carries its own
    # limit below, so a slow package mirror cannot spend the gate's time and
    # cancel verification mid-run.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Provision pinned toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Verify toolchain matches the repository pins
        run: pnpm toolchain:check

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Resolve the pinned browser version
        id: browsers
        run: |
          version="$(pnpm exec playwright --version | awk '{ print $2 }')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Playwright's system dependencies are ~114 MB of Ubuntu archive packages
      # that every browser here needs. Fetching them from the distribution
      # mirror on every run puts an external service Velora does not control on
      # the critical path of the only gate, and a degraded mirror has already
      # turned a two-minute step into an hour. Cache the packages themselves and
      # the mirror stops mattering except when the pinned version moves.
      - name: Restore the browser system-dependency cache
        uses: actions/cache@v6
        with:
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.browsers.outputs.version }}
          path: ~/.cache/velora-playwright-apt
          restore-keys: |
            playwright-apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install browsers for end-to-end tests
        # A cold cache against a degraded mirror fails here, loudly and by
        # itself, rather than consuming the whole job budget. Nothing is
        # skipped, shortened, or made optional: the same three browsers and the
        # same system dependencies are installed either way.
        timeout-minutes: 25
        run: |
          printf 'Binary::apt::APT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-velora-keep-downloads > /dev/null
          mkdir -p ~/.cache/velora-playwright-apt
          sudo cp -a ~/.cache/velora-playwright-apt/. /var/cache/apt/archives/
          pnpm exec playwright install --with-deps
          # Rebuild the cache from what this run actually needed, so a package
          # that a later Ubuntu image stops using does not live here forever.
          rm -rf ~/.cache/velora-playwright-apt
          mkdir -p ~/.cache/velora-playwright-apt
          sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' \
            -exec cp -a {} ~/.cache/velora-playwright-apt/ ';'
          sudo chown -R "$(id -u):$(id -g)" ~/.cache/velora-playwright-apt

      - name: Verify
        run: pnpm ci:verify

  # Compiling Android is deliberately not part of `pnpm ci:verify`. That gate
  # runs everywhere and needs no JDK, no Android SDK, and no secret; requiring
  # six gigabytes of toolchain for it would make the repository's only check
  # unrunnable for most contributors. So the native build gates `main` from
  # beside the canonical gate rather than inside it, and a commit that breaks
  # it still turns this workflow red.
  #
  # `pnpm android:verify`, which asserts the *generated project* against what
  # `app.config.ts` declares, is inside `ci:verify` above and runs on every
  # machine. This job is the part that needs a compiler.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Provision pinned toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Provision the JDK the Android Gradle Plugin requires
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # The runner image carries an Android SDK, but not necessarily these
      # exact components. Naming them means the build compiles against the
      # levels `app.config.ts` declares rather than whatever the image happens
      # to ship this month; already-present packages are a no-op.
      - name: Install the declared Android SDK components
        run: |
          # The runner image sets ANDROID_HOME but does not put the SDK's own
          # tools on PATH, so `sdkmanager` has to be located rather than
          # called. The versioned directory is tried after `latest` because the
          # image has shipped both layouts.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          test -x "$sdkmanager" || {
            echo "No sdkmanager under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          }
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006' \
            'platform-tools'

      - name: Report the Android toolchain
        run: pnpm android:doctor

      # Gradle downloads several gigabytes on a cold cache, and the NDK
      # compiles React Native's C++ from scratch. Both are keyed on the files
      # that decide their contents, so a dependency bump invalidates them and
      # nothing else does.
      - name: Restore the Gradle cache
        uses: actions/cache@v6
        with:
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          restore-keys: |
            gradle-${{ runner.os }}-

      # A release build bundles JavaScript through Metro, which resolves the
      # workspace packages to their built entry points. Only Consumer Mobile's
      # dependencies are built here; the canonical gate builds everything.
      - name: Build the packages the bundle resolves
        run: pnpm exec turbo run build --filter=@velora/mobile^...

      # Builds the debug APK, the release APK, and the release AAB, then opens
      # each one and asserts its manifest. No signing material is provided, so
      # the release artifacts come out unsigned — which is the fail-closed
      # behaviour, and is reported rather than hidden.
      - name: Build and inspect the Android artifacts
        run: pnpm android:build

      - name: Keep the artifacts for this commit
        uses: actions/upload-artifact@v5
        with:
          if-no-files-found: error
          name: android-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
