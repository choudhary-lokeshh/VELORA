name: verify

# The repository's only pipeline. It provisions the pinned toolchain and runs
# the canonical `pnpm ci:verify` graph; it never duplicates that graph here.
# The scheduled run exists so the dependency risk acceptance expiry in
# docs/security/08-dependency-risk-acceptance.md fires on time even when no
# commit lands.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Docker is preinstalled, which Testcontainers requires for the real
    # PostgreSQL and Redis integration tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Provision pinned toolchain
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Verify toolchain matches the repository pins
        run: pnpm toolchain:check

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install browsers for end-to-end tests
        run: pnpm exec playwright install --with-deps

      - name: Verify
        run: pnpm ci:verify
