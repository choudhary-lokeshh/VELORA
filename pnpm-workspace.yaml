# Transitive pins that exist only to reach a patched release the declaring
# package's own range already admits.
#
# `@istanbuljs/load-nyc-config@1.1.0` — its latest, reached through Jest under
# Expo — declares `js-yaml: ^3.13.1`, and the patched `3.15.2` sits inside that
# range. The resolver kept the older resolution the lockfile already held, so
# this collapses it forward. It is a pin *within* a declared range rather than
# an override outside one, which is the line the dependency risk register draws.
#
# Self-retiring: delete it when the tree no longer resolves `js-yaml@3` below
# `3.15.2` on its own.
#
# `source-map-js@1.2.2` and `vite@8.2.4` are the same kind of pin. `postcss`
# declares `source-map-js: ^1.2.1` and `vitest`/`@vitest/mocker` declare
# `vite: ^6.0.0 || ^7.0.0 || ^8.0.0`; both patched releases sit inside those
# ranges, but a depth-unbounded `pnpm update` left one `postcss` snapshot on
# `source-map-js@1.2.1` (GHSA-68fv-2mgg-jv7q) and the peer-resolved `vite` on
# `8.2.1` (GHSA-587h-7wmj-h5pm). Each is self-retiring on the same rule: delete
# it once the tree resolves the patched release without it.
overrides:
  js-yaml@3: 3.15.2
  source-map-js@1: 1.2.2
  vite@8: 8.2.4

engineStrict: true
saveExact: true
strictPeerDependencies: true
minimumReleaseAge: 1440

allowBuilds:
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  protobufjs: true
  ssh2: false
