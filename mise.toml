#:schema https://mise.jdx.dev/schema/mise.json
# Velora toolchain pins.
#
# This file is the single provisioning authority for the runtimes the
# repository requires. The same versions are asserted by
# `package.json#engines`, `.node-version`, and `.bun-version`, and
# `pnpm toolchain:check` fails when any of those four sources disagree.
#
# Bootstrap:
#   mise install
#   pnpm install --frozen-lockfile
#
# CI provisions the identical versions from this file via `jdx/mise-action`.

[tools]
bun = "1.3.14"
node = "24.19.0"
pnpm = "11.21.0"

[settings]
# Never silently substitute a different version than the one pinned above.
idiomatic_version_file_enable_tools = ["node"]
